name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atividadedevops-backend-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare database directory
        run: mkdir -p data
        env:
          DATABASE_URL: sqlite:///./data/database.db

      - name: Start server & test health endpoint
        env:
          DATABASE_URL: sqlite:///./data/database.db
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3
          curl -sf http://127.0.0.1:8000/ | grep -q '"ok"'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atividadedevops-frontend-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: atividadedevops-frontend-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate dist folder
        run: test -d dist && echo "✓ dist/ generated"
